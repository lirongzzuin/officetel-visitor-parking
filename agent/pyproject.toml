[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "opa-agent"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
]

[project.scripts]
opa-agent = "opa_agent.__main__:main"

[tool.pyinstaller]
name = "officetel_agent"
onefile = true
console = true
icon = "installer/icon.ico"
