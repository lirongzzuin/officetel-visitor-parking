name: Build & Release Agent EXE

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/build_agent.yml'
      - '.github/workflows/build_probe.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: '버전 태그 (예: v1.2.3, 비워두면 날짜 자동 생성)'
        required: false

permissions:
  contents: write

jobs:
  build-agent:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version tag
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v1.$(date -u +%Y%m%d).${{ github.run_number }}"
          fi
          VER="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "ver=$VER" >> $GITHUB_OUTPUT
          echo "Auto version: $TAG"

      - name: Set up Python 3.12 (32-bit — Access ODBC 드라이버 호환)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x86'

      - name: Install dependencies
        run: pip install pyinstaller pyodbc

      - name: Write version into source
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.ver }}"
          (Get-Content opa_agent\__init__.py) -replace '__version__ = ".*"', "__version__ = `"$ver`"" |
            Set-Content opa_agent\__init__.py
          echo "Version set to $ver"

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --name officetel_agent `
            --console `
            --clean `
            opa_agent\__main__.py

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "dist\officetel_agent.exe"
          if (-not (Test-Path $exe)) { throw "EXE not found!" }
          $size = (Get-Item $exe).Length / 1MB
          echo "EXE size: $([math]::Round($size,1)) MB"

      - name: Build cartan_probe EXE (DB 탐침 도구)
        shell: pwsh
        run: |
          Push-Location diagnostic
          pyinstaller `
            --onefile `
            --name cartan_probe `
            --console `
            --clean `
            probe.py
          Pop-Location
          if (-not (Test-Path "diagnostic\dist\cartan_probe.exe")) {
            throw "cartan_probe.exe 빌드 실패"
          }
          echo "cartan_probe.exe 빌드 성공"

      - name: Package installer zip
        shell: pwsh
        run: |
          $zip_dir = "installer_package"
          New-Item -ItemType Directory -Path $zip_dir -Force | Out-Null

          Copy-Item "dist\officetel_agent.exe"              "$zip_dir\"
          Copy-Item "diagnostic\dist\cartan_probe.exe"      "$zip_dir\"
          Copy-Item "installer\install.bat"                 "$zip_dir\"
          Copy-Item "installer\uninstall.bat"               "$zip_dir\"
          Copy-Item "installer\config.json.example"         "$zip_dir\"
          Copy-Item "installer\README_관리소장님께.txt"      "$zip_dir\"

          choco install nssm --no-progress -y | Out-Null
          $nssm_src = (Get-Command nssm -ErrorAction SilentlyContinue)?.Source
          if (-not $nssm_src) { $nssm_src = "C:\ProgramData\chocolatey\bin\nssm.exe" }
          Copy-Item $nssm_src "$zip_dir\nssm.exe"

          Compress-Archive -Path "$zip_dir\*" -DestinationPath "officetel_agent_installer.zip" -Force
          echo "패키지 생성 완료 (cartan_probe.exe 포함)"

      - name: Upload artifact (임시 보관)
        uses: actions/upload-artifact@v4
        with:
          name: officetel_agent_installer
          path: agent/installer_package/
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "에이전트 ${{ steps.version.outputs.tag }}"
          prerelease: false
          body: |
            ## OO오피스텔 주차 관리 에이전트 ${{ steps.version.outputs.tag }}

            **빌드:** ${{ github.sha }}
            **트리거:** ${{ github.event_name }}

            ### 자동 업데이트
            - 관리실 PC의 에이전트가 1시간 내 자동으로 이 버전으로 업데이트됩니다.
            - 별도 작업 불필요.

            ### 수동 즉시 업데이트
            - 서버에서 `update` 명령을 전송하면 즉시 적용됩니다.
          files: |
            agent/dist/officetel_agent.exe
            agent/diagnostic/dist/cartan_probe.exe
            agent/officetel_agent_installer.zip
